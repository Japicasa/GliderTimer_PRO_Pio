; GliderTimer PRO - PlatformIO Project Configuration
; (convertido desde el sketch Arduino IDE GliderTimer, rama Verbose-Pilots-search)
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor
; SPIFFS:   pio run -t uploadfs        (sube la carpeta data/)

[platformio]
default_envs = m5stack

[env:m5stack]
; espressif32@1.12.4 = arduino-esp32 1.0.4 (el core con el que se compilaba en Arduino IDE)
platform               = espressif32@1.12.4
framework              = arduino
board                  = esp32dev
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = qio
board_build.filesystem = spiffs
board_upload.flash_size = 4MB
board_build.partitions = Flashutils/timer4M.csv
upload_speed           = 921600
monitor_speed          = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Librerias: se reproducen las versiones con las que se compilaba en Arduino IDE
; (core 1.0.4). Las que no estan en el registry, o estan modificadas, van
; copiadas en lib/ desde el sketchbook de Arduino:
;   lib/M5Stack             0.3.1
;   lib/ESPAsyncWebServer   1.2.3  (me-no-dev master f71e3d4, sin dependencias en library.json)
;   lib/AsyncTCP            1.1.4
;   lib/DFRobotDFPlayerMini 1.0.2
;   lib/Adafruit_SSD1306    1.1.2
;   lib/Adafruit_GFX_Library 1.7.5
lib_deps =
    https://github.com/gmag11/ESPNtpClient.git#0.2.5   ; 0.2.6+ requiere lwIP del core 2.x
lib_ldf_mode = chain+
