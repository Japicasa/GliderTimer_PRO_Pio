    <style>
      .gliderkeeper {
        background-color: rgb(2, 64, 10);
        border-color: rgb(2, 64, 10);
        cursor: default;
        color: white;
        border-radius: 6px;
        font-size: 1em;
        overflow: hidden;
      }

      .gliderkeeper_btn {
        border-radius: 6px;
        font-size: 1.5em;
      }
    </style>
</head>

<body>

  <div class="container-fluid">

    <nav class="navbar navbar-expand-md navbar-dark row gliderkeeper">
      <a class="navbar-brand" href="index.html"><strong>GliderTimer</strong></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon" style="color: white"></span>
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" style="color: white" href="PlotFlight.html">Run Flights</a>

    <h3 class="mt-2">Competition Config</h3>
    <form id='idForm'>
      <div class="form-group">
        <label for="idURLCompetition">Competition URL</label>
        <input type="url" class="form-control" id="idURLCompetition" placeholder="Example: http://comp.gliderlink.com">
      </div>
      <div class="form-group">
        <label for="idCompetition">Competition Number</label>
        <input type="number" class="form-control" id="idCompetition">
      </div>
      <div class="form-group">
        <label for="idPilotNum">Pilot Number</label>
        <input type="number" class="form-control" id="idPilotNum">
      </div>
      <div class="row" id="button-line">
        <div class="mx-auto mt-3">
          <input type="submit" id="btn-save" type="button" class="btn btn-info" value="Save">
        </div>
      </div>
      <div id="idMsg" class="mt-2" style="display: none;">
        <div class="alert alert-success" role="alert">
          Done!
        </div>
      </div>
    </form>
  </div>
